name: Build APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create project
        run: |
          npx --yes create-expo-app@latest app --template blank --no-install
          rm -f app/App.tsx app/App.js
          cp App.js app/App.js
          cd app
          npm install
          npx expo install expo-document-picker
          npm install llama.rn react-native-fs react-native-device-info
      - name: Prebuild Android
        run: cd app && npx expo prebuild --platform android --no-install
      - name: Build APK
        run: |
          cd app/android
          echo "org.gradle.jvmargs=-Xmx4g" >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: CrownLocal-apk
          path: app/android/app/build/outputs/apk/release/*.apk
